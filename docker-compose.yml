# 两种运行模式：
#   任务模式: docker compose up agent-task
#   服务模式: docker compose up agent-service

services:
  # ---- 任务模式（一次性执行） ----
  agent-task:
    build:
      context: .
      dockerfile: docker/agent-task-dsh/Dockerfile
      target: task
    image: dios-diagent-task:dsh-dev
    container_name: agent-task
    environment:
      TASK_CONFIG: /workspace/agent-task.dsh.json
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
      OUTPUT_DIR: /workspace/output
      TRIGGER_MODE: once
    volumes:
      - ./workspace:/workspace
    restart: "no"

  # ---- 服务模式（常驻聊天/事件） ----
  agent-service:
    build:
      context: .
      dockerfile: docker/agent-task-dsh/Dockerfile
      target: service
    image: dios-diagent-service:dsh-dev
    container_name: agent-service
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AGENT_WORKSPACE: /workspace
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-}
      LLM_MODELS_CONFIG_PATH: /workspace/models.yaml
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
    volumes:
      - ./workspace:/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
